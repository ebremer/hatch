name: build

on:
  push:
  pull_request:

env:
  # OpenSlide's freely redistributable Aperio test slide (1.9 MB)
  TEST_SLIDE_URL: https://openslide.cs.cmu.edu/download/openslide-testdata/Aperio/CMU-1-Small-Region.svs

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent readers
        run: pip install numpy tifffile pillow openslide-python openslide-bin
      - name: Convert a real Aperio slide and check it independently
        run: |
          curl -fsSL -o slide.svs "$TEST_SLIDE_URL"
          JAR=$(ls target/hatch-*.jar | grep -v shaded | head -n1)
          java -jar "$JAR" -src slide.svs -dest out.tif
          python ci/check_output.py out.tif slide.svs

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: maven
      - name: Build the native image
        run: mvn -B -Pnative -DskipTests package
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent readers
        run: pip install numpy tifffile pillow openslide-python openslide-bin
      - name: Convert a real Aperio slide with the native binary and check it
        run: |
          curl -fsSL -o slide.svs "$TEST_SLIDE_URL"
          ./target/hatch -src slide.svs -dest out.tif
          python ci/check_output.py out.tif slide.svs
